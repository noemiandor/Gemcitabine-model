  plan_path: "/Users/4482173/Documents/GitHub/Gemcitabine-model/Data/in-vivo/Plan/pseudotime_treatment_by_ploidy_matched_state_plan.md"
  objective: "V3 methodological repair and calibration of matched-pseudotime treatment-by-baseline-initial-ploidy transcriptional program analysis."
  primary_estimand: "treatment_by_initial_ploidy_interaction"
  v1_result_root: "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/04j_pseudotime_treatment_ploidy_programs"
