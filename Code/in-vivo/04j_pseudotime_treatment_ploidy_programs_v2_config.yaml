analysis:
  name: "04j_pseudotime_treatment_ploidy_programs_v2"
  version: "04j_v2_2026_07_15"
  frozen_date: "2026-07-15"
  plan_path: "/Users/4482173/Documents/GitHub/Gemcitabine-model/Data/in-vivo/Plan/pseudotime_treatment_by_ploidy_matched_state_plan.md"
  objective: "Post-hoc methodological investigation of matched-pseudotime treatment-by-baseline-initial-ploidy transcriptional program analysis."
  expression_data_inspected_for_interval_selection: false
  estimand_note: "Association in captured endpoint cells from an outcome-selected sequenced cohort; not a population-average causal treatment effect."
  v1_result_root: "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/04j_pseudotime_treatment_ploidy_programs"
  v2_result_root: "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/04j_pseudotime_treatment_ploidy_programs_v2"
  v1_role: "legacy_v1_comparison"
  method_lock_note: "Program universe, score methods, gene-set methods, simulations, FDR families, and coordinate rules are fixed before inspecting v2 interaction results."

inputs:
  cell_metadata: "Data/in-vivo/CellCycleCells_pseudotime_distribution_per_sample_cell_level_with_ploidy_dose_tgi.csv"
  sample_info: "Data/in-vivo/sample_info.xlsx"
  seurat_rds_candidates:
    - "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/03c_cluster_annotation/04_objects/integrated_sct_cca_seurat_cluster_final_annotation.rds"
    - "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/03b_manual_cluster_merge/objects/integrated_sct_cca_seurat_final_manual_merge.rds"
    - "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/03_final_cluster/03_objects/integrated_sct_cca_seurat_final_reclustered.rds"
    - "/Volumes/Protable Disk/Project/BreastCancerOrthotopicModels/Results/02e_cluster_annotation/04_objects/integrated_sct_cca_seurat_cluster_final_annotation.rds"
  assay: "RNA"
  counts_layer: "counts"

pseudotime:
  scenario: "CellCycle ROOT_6_END_NULL"
  scale: "[0, 1]"
  orientation: "Frozen upstream CellCycle pseudotime orientation; no rerooting, rescaling, or interval re-selection."

treatment:
  primary_control_doses_mg_per_kg: [0]
  primary_treated_doses_mg_per_kg: [30, 120]
  dose_specific_levels_mg_per_kg: [0, 30, 120]
  primary_modifier: "initial_ploidy"
  primary_modifier_note: "Baseline tumor-of-origin assignment; endpoint cell ploidy is post-treatment and descriptive only."

endpoint_ploidy:
  source_column: "average_ploidy"
  continuous_column: "sample_mean_endpoint_ploidy"
  continuous_scaled_column: "sample_mean_endpoint_ploidy_scaled"
  interpretation_note: "Post-treatment sample-level endpoint ploidy is a descriptive sensitivity modifier, not a baseline predictive biomarker."
  thresholds:
    - method: "ETP_fixed_threshold_2_25"
      threshold_scheme: "fixed_threshold_2_25"
      threshold: 2.25
      group_column: "ETP_fixed_threshold_2_25_group"
      factor_column: "ETP_fixed_threshold_2_25_factor"
      group_levels: ["ETP-lower", "ETP-higher"]
    - method: "ETP_boundary_stress_threshold_2_375"
      threshold_scheme: "boundary_stress_threshold_2_375"
      threshold: 2.375
      group_column: "ETP_boundary_stress_threshold_2_375_group"
      factor_column: "ETP_boundary_stress_threshold_2_375_factor"
      group_levels: ["ETP-lower", "ETP-higher"]
    - method: "ETP_reference_balanced_threshold_2_24"
      threshold_scheme: "reference_balanced_threshold_2_24"
      threshold: 2.24
      group_column: "ETP_reference_balanced_threshold_2_24_group"
      factor_column: "ETP_reference_balanced_threshold_2_24_factor"
      group_levels: ["ETP-lower", "ETP-higher"]

qc:
  min_metadata_to_counts_match_rate: 1.0
  min_cells_per_mouse_subbin: 5
  min_library_size_per_mouse_subbin: 5000
  min_detected_genes_per_mouse_subbin: 250
  min_mice_per_ploidy_treatment_subbin: 2
  min_common_support_subbins: 2
  min_cells_per_mouse_region: 10
  gene_filter_cpm: 1
  gene_filter_min_observations: 4
  min_program_genes_observed: 2
  voom_quality_weight_min: 0
  voom_quality_weight_note: "Recorded for diagnostics; not used as a hard exclusion in the first frozen implementation."

