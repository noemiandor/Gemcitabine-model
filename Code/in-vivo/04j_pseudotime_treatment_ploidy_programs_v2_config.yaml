program_scoring:
  default_mode: "signed_weighted_mean"
  normalization: "TMM_logCPM_prior_count_1"
  gene_standardization: "gene_wise_zscore_across_retained_mouse_subbins"
  weight_denominator: "sum_abs_observed_gene_weights"
  default_gene_weight: 1
  direction_source: "expected_direction_fixed_in_config"
  direction_signs:
    contextual: 1
    replication_execution: -1
    stress_response: 1
    fate_response: 1
    negative_control: 1
  direction_labels:
    contextual: "higher contextual expression"
    replication_execution: "lower replication-execution expression"
    stress_response: "higher stress-response expression"
    fate_response: "higher fate-response expression"
    negative_control: "higher negative-control expression"
  score_methods:
    - id: "signed_weighted_mean_zscore"
      label: "Primary signed weighted mean z-score"
      role: "primary"
      mode: "signed_weighted_mean_zscore"
      description: "Mean of pre-specified signed gene-wise z-scores; md-defined primary score."
    - id: "signed_pca_eigengene"
      label: "Signed PCA eigengene"
      role: "score_definition_sensitivity"
      mode: "signed_pca_eigengene"
      min_genes: 2
      orient_to: "signed_weighted_mean_zscore"
      standardize_scores: true
      description: "PC1 of sign-oriented gene z-scores, oriented to correlate positively with the primary signed mean score."
    - id: "signed_rank_mean"
      label: "Signed rank-mean score"
      role: "score_definition_sensitivity"
      mode: "signed_rank_mean"
      rank_background: "retained_gene_logcpm"
      rank_transform: "centered_percentile"
      description: "Signed weighted mean of within-observation retained-gene centered percentile ranks."
    - id: "trimmed_signed_mean_zscore"
      label: "Robust trimmed signed mean z-score"
      role: "score_definition_sensitivity"
      mode: "trimmed_signed_mean_zscore"
      trim_fraction: 0.10
      min_genes_for_trimming: 10
      fallback_method: "signed_weighted_mean_zscore"
      description: "Signed weighted mean after trimming the lowest and highest 10% signed gene-z contributions; small programs fall back to primary score."
    - id: "within_subbin_residual_zscore"
      label: "Within-subbin residual standardized z-score"
      role: "targeted_v2_score"
      mode: "within_subbin_residual_zscore"
      residual_model: "subbin_only_no_treatment_no_ploidy_no_etp"
      gene_scale: "robust_empirical_bayes_posterior_residual_sd"
      weight_denominator: "sum_abs_observed_gene_weights"
      program_observation_weight: "robust_program_gene_voom_weight_mean_standardized_to_mean_1"
      description: "V2 targeted score centered within pseudotime subbin and scaled without treatment, initial ploidy, endpoint ploidy, TGI, or interaction information."

v2_methods:
  existing_score_phase: ["signed_weighted_mean_zscore", "signed_pca_eigengene", "signed_rank_mean", "trimmed_signed_mean_zscore"]
  targeted_score_phase: ["within_subbin_residual_zscore"]
  self_contained:
    fry_directional_mean: true
    mroast_directional_mean: true
    mroast_msq: true
    mroast_rotations_observed: 9999
    mroast_seed: 41041
  competitive_camera:
    use_ranks: [false, true]
    rho_values: [0.01, 0.03, 0.05, 0.10]
  ranked_gsea:
    exploratory_only: true
  fdr_families: ["all_universe", "focused_tier1_tier2", "tier3", "controls"]

simulation:
  seed: 91157
  null_replicates: 1000
  power_replicates: 300
  mroast_validation_replicates: 120
  alpha: 0.05
  fdr_alpha: 0.10
  program_sizes: ["small", "medium", "large"]
  active_gene_fractions: [0.10, 0.25, 0.50, 1.00]
  direction_patterns: ["coherent", "mixed", "externally_signed"]
  standardized_effect_sizes: [0.00, 0.20, 0.35, 0.50, 0.80]
  overlap_modes: ["observed", "low_overlap", "high_overlap"]
  inter_gene_correlation_modes: ["observed", "low", "moderate", "high"]
  judgment_thresholds:
    calibrated_type1_upper: 0.075
    calibrated_fdr_upper: 0.15
    useful_power_minimum: 0.50
    direction_accuracy_minimum: 0.70

coordinates:
  original:
    id: "original_pseudotime"
    role: "primary"
  sensitivity:
    - id: "untreated_learned_coordinate"
      role: "independent_coordinate"
      learner: "control_only_expression_pca_projection"
      root_orientation: "orient_to_original_control_pseudotime"
    - id: "target_genes_excluded_coordinate"
      role: "target_excluded_coordinate"
      learner: "expression_pca_projection_after_excluding_tested_program_genes"
      root_orientation: "orient_to_original_pseudotime"

signature_projection:
  external_invitro_projection:
    search_roots:
